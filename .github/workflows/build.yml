name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
            ext: exe
          - os: macos-latest
            target: mac
            ext: dmg
          - os: ubuntu-latest
            target: linux
            ext: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libasound2t64
      - name: Install npm deps
        run: |
          npm ci
          cd viewer && npm ci && cd ..
      - name: Build
        run: npm run electron:build:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: uinh-jiek-${{ matrix.os }}
          path: release/*

<html>

    background:#f8f9fb; font-family:system-ui,-apple-system,sans-serif;

  .box { text-align:center; }
  h1 {
    font-size:48px; font-weight:700; color:#6366f1; letter-spacing:8px; margin-bottom:16px;
  }
  p { font-size:14px; color:#94a3b8; }
</style>
</head>
<body>
  <div class="box">
    <h1>韵易</h1>
    <p>时有古今，地有南北，字有更革，音有转移‌。</p>
  </div>
